<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Shift & Break Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #10b981;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1.25rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    
    .toggle-container { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    input[type="time"], input[type="number"] { padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; width: 100%; outline: none; }
    input[type="time"]:focus, input[type="number"]:focus { border-color: var(--primary); }

    .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .schedule-item { background: #f1f5f9; padding: 0.75rem; border-radius: 8px; text-align: center; }
    .schedule-item span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .schedule-item strong { font-size: 1rem; color: var(--text); margin-top: 0.25rem; display: block; }

    .timer-display { text-align: center; padding: 1rem; background: #eeef2; border-radius: 8px; margin-bottom: 1rem; background: #eef2ff; border: 1px solid #c7d2fe; }
    .timer-time { font-size: 2.5rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }

    .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.secondary:hover { background: #cbd5e1; }
    button.danger { background: #ef4444; color: white; }
    button.danger:hover { background: #dc2626; }

    .custom-break { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .custom-break input { flex: 1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Shift & Break Tracker</h1>
    <div class="toggle-container">
      <span>Notifications</span>
      <label class="switch">
        <input type="checkbox" id="notify-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div class="card">
    <div class="card-title">Shift Setup</div>
    <div class="form-group">
      <label for="shift-start">Shift Start Time</label>
      <input type="time" id="shift-start" value="09:00">
    </div>

    <div class="schedule-grid">
      <div class="schedule-item">
        <span>1st Break (15m)</span>
        <strong id="sched-b1">11:00 AM</strong>
      </div>
      <div class="schedule-item">
        <span>Lunch (30m)</span>
        <strong id="sched-lunch">01:00 PM</strong>
      </div>
      <div class="schedule-item">
        <span>2nd Break (15m)</span>
        <strong id="sched-b2">03:15 PM</strong>
      </div>
      <div class="schedule-item">
        <span>Shift End</span>
        <strong id="sched-end">05:30 PM</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Active Break</div>
    
    <div class="timer-display">
      <div class="timer-time" id="timer-display">00:00</div>
      <div class="timer-label" id="timer-label">No active break</div>
    </div>

    <div class="btn-group">
      <button onclick="startPresetBreak(15, '1st Break (15m)')">15m Break</button>
      <button onclick="startPresetBreak(30, 'Lunch (30m)')">30m Lunch</button>
      <button onclick="startPresetBreak(15, '2nd Break (15m)')">15m Break</button>
    </div>

    <div class="custom-break">
      <input type="time" id="custom-time">
      <input type="number" id="custom-duration" placeholder="Min" value="15" min="1" style="width: 80px;">
      <button class="secondary" onclick="startCustomBreak()">Set Custom</button>
      <button class="danger" onclick="stopTimer()">Stop</button>
    </div>
  </div>
</div>

<script>
  let timerInterval = null;
  let targetEndTime = null;

  const shiftStartInput = document.getElementById('shift-start');
  const notifyToggle = document.getElementById('notify-toggle');
  const timerDisplay = document.getElementById('timer-display');
  const timerLabel = document.getElementById('timer-label');

  // Initialize Shift Calculation
  shiftStartInput.addEventListener('change', calculateSchedule);
  window.addEventListener('load', () => {
    // Set current time as default rounded start
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(Math.floor(now.getMinutes()/5)*5).padStart(2, '0');
    shiftStartInput.value = `${hours}:${minutes}`;
    calculateSchedule();
  });

  // Calculate recommended schedule
  function calculateSchedule() {
    const startVal = shiftStartInput.value;
    if (!startVal) return;

    const [h, m] = startVal.split(':').map(Number);
    const start = new Date();
    start.setHours(h, m, 0, 0);

    const b1 = new Date(start.getTime() + 2 * 3600000); // 2 hours in
    const lunch = new Date(start.getTime() + 4 * 3600000); // 4 hours in
    const b2 = new Date(start.getTime() + 6.25 * 3600000); // 6.25 hours in
    const end = new Date(start.getTime() + (8.5 * 3600000)); // 8h shift + 30m unpaid lunch = 8.5h total

    document.getElementById('sched-b1').textContent = formatTime(b1);
    document.getElementById('sched-lunch').textContent = formatTime(lunch);
    document.getElementById('sched-b2').textContent = formatTime(b2);
    document.getElementById('sched-end').textContent = formatTime(end);
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Handle Notifications
  notifyToggle.addEventListener('change', async () => {
    if (notifyToggle.checked) {
      if (!("Notification" in window)) {
        alert("This browser does not support desktop notifications.");
        notifyToggle.checked = false;
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        alert("Notification permission denied.");
        notifyToggle.checked = false;
      }
    }
  });

  function sendNotification(title, body) {
    if (notifyToggle.checked && Notification.permission === "granted") {
      new Notification(title, { body, icon: "https://fav.farm/⏰" });
    }
    playChime();
  }

  // Soft Web Audio API Beep
  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    } catch (e) {
      console.log("Audio play blocked by browser.");
    }
  }

  // Timer Functions
  function startPresetBreak(durationMinutes, label) {
    const now = new Date();
    targetEndTime = new Date(now.getTime() + durationMinutes * 60000);
    runTimer(label);
  }

  function startCustomBreak() {
    const timeVal = document.getElementById('custom-time').value;
    const duration = parseInt(document.getElementById('custom-duration').value, 10);

    if (!duration || duration <= 0) return alert("Enter a valid duration.");

    const now = new Date();
    let startTime = new Date();

    if (timeVal) {
      const [h, m] = timeVal.split(':').map(Number);
      startTime.setHours(h, m, 0, 0);
    }

    targetEndTime = new Date(startTime.getTime() + duration * 60000);

    if (targetEndTime <= now) {
      alert("Calculated break end time is in the past!");
      return;
    }

    const formattedEnd = formatTime(targetEndTime);
    runTimer(`Break (Ends at ${formattedEnd})`);
  }

  function runTimer(label) {
    clearInterval(timerInterval);
    
    function update() {
      const now = new Date();
      const diff = targetEndTime - now;

      if (diff <= 0) {
        clearInterval(timerInterval);
        timerDisplay.textContent = "00:00";
        timerLabel.textContent = "Break ended!";
        sendNotification("Break Finished!", "Your break time is up. Back to work!");
        return;
      }

      const m = Math.floor(diff / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      timerLabel.textContent = `${label} • Ends at ${formatTime(targetEndTime)}`;
    }

    update();
    timerInterval = setInterval(update, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerDisplay.textContent = "00:00";
    timerLabel.textContent = "No active break";
  }
</script>
</body>
</html>

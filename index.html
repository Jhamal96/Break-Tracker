<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Shift & Break Tracker</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 1.25rem; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1.25rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    
    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .toggle-container { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; }
    
    .save-indicator { font-size: 0.75rem; color: var(--accent); font-weight: 600; opacity: 0; transition: opacity 0.3s; }
    .save-indicator.active { opacity: 1; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
    label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
    
    input[type="time"], input[type="number"], input[type="text"] { 
      padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; width: 100%; outline: none; background: #fff;
    }
    input[type="time"]:focus, input[type="number"]:focus, input[type="text"]:focus { border-color: var(--primary); }

    .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .schedule-item { background: #f1f5f9; padding: 0.75rem; border-radius: 8px; text-align: center; }
    .schedule-item span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .schedule-item strong { font-size: 0.95rem; color: var(--text); margin-top: 0.25rem; display: block; }
    .schedule-item.highlight { background: #eef2ff; border: 1px solid #c7d2fe; }

    .timer-display { text-align: center; padding: 1rem; background: #eef2ff; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #c7d2fe; }
    .timer-time { font-size: 2.5rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; font-weight: 500; }

    .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.65rem 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s; font-size: 0.875rem; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.secondary:hover { background: #cbd5e1; }
    button.success { background: var(--accent); color: white; }
    button.success:hover { background: var(--accent-hover); }
    button.danger { background: #ef4444; color: white; }
    button.danger:hover { background: #dc2626; }
    button.sm { padding: 0.4rem 0.6rem; font-size: 0.75rem; }

    /* Grayed out / Disabled state */
    button:disabled, input:disabled {
      opacity: 0.4;
      cursor: not-allowed !important;
      pointer-events: none;
      background-color: #cbd5e1 !important;
      color: #64748b !important;
    }

    .custom-break { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .custom-break input { flex: 1; }

    .break-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Shift & Break Tracker</h1>
    <div class="header-actions">
      <div class="toggle-container">
        <span>Notify</span>
        <label class="switch">
          <input type="checkbox" id="notify-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>

  <!-- Shift Setup -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Shift Setup</div>
      <span class="save-indicator" id="save-indicator">✓ Synced</span>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="shift-start">Shift Start Time (Scheduled)</label>
        <input type="time" id="shift-start" value="09:00">
      </div>
      <div class="form-group">
        <label for="official-start">Official Start Time (Clock-in)</label>
        <input type="time" id="official-start" value="09:00">
      </div>
    </div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
      <button class="secondary sm" style="width: 100%;" onclick="syncOfficialWithShift()">Sync Official with Shift Start</button>
      <button class="secondary sm" style="width: 100%;" onclick="setCurrentAsOfficial()">Clock In Now (Current Time)</button>
    </div>

    <div class="schedule-grid">
      <div class="schedule-item">
        <span>1st Break (15m)</span>
        <strong id="sched-b1">11:00 AM</strong>
      </div>
      <div class="schedule-item">
        <span>Lunch (30m)</span>
        <strong id="sched-lunch">01:00 PM</strong>
      </div>
      <div class="schedule-item">
        <span>2nd Break (15m)</span>
        <strong id="sched-b2">03:15 PM</strong>
      </div>
      <div class="schedule-item highlight">
        <span>Shift End</span>
        <strong id="sched-end">05:30 PM</strong>
      </div>
    </div>
  </div>

  <!-- Active Break Tracker -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Active Break Tracker</div>
    </div>
    
    <div class="timer-display">
      <div class="timer-time" id="timer-display">00:00</div>
      <div class="timer-label" id="timer-label">No active break</div>
    </div>

    <div class="btn-group">
      <button id="btn-b1" class="break-btn" onclick="startPresetBreak(15, '1st Break (15m)', 'b1')">15m Break</button>
      <button id="btn-lunch" class="break-btn" onclick="startPresetBreak(30, 'Lunch (30m)', 'lunch')">30m Lunch</button>
      <button id="btn-b2" class="break-btn" onclick="startPresetBreak(15, '2nd Break (15m)', 'b2')">15m Break</button>
    </div>

    <div class="custom-break">
      <input type="time" id="custom-time" class="break-input">
      <input type="number" id="custom-duration" class="break-input" placeholder="Min" value="15" min="1" style="width: 75px;">
      <button id="btn-custom" class="secondary break-btn" onclick="startCustomBreak()">Set Custom</button>
    </div>

    <div class="break-actions">
      <button class="success" onclick="completeBreak()">✓ Complete Break</button>
      <button class="danger" onclick="resetBreaks()">Reset Breaks</button>
    </div>
  </div>
</div>

<script>
  // Supabase Configuration
  const SUPABASE_URL = "https://vxpufrahrnwmtgltjstd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tRjMtsoo9aT-6n7dzj9p-w_HsUqJ520";

  let timerInterval = null;
  let targetEndTime = null;
  let activeBreakName = "";
  let activeBreakKey = "";
  let supabaseClient = null;

  // Track completed breaks and their completion end times
  let completedBreaks = {
    b1: null,
    lunch: null,
    b2: null
  };

  const shiftStartInput = document.getElementById('shift-start');
  const officialStartInput = document.getElementById('official-start');
  const notifyToggle = document.getElementById('notify-toggle');
  const timerDisplay = document.getElementById('timer-display');
  const timerLabel = document.getElementById('timer-label');
  const saveIndicator = document.getElementById('save-indicator');

  window.addEventListener('DOMContentLoaded', async () => {
    initSupabase();
    await loadSavedData();
    calculateSchedule();
    updateControlsState();
  });

  shiftStartInput.addEventListener('change', () => { calculateSchedule(); saveData(); });
  officialStartInput.addEventListener('change', () => { calculateSchedule(); saveData(); });
  notifyToggle.addEventListener('change', () => { saveData(); });

  function syncOfficialWithShift() {
    officialStartInput.value = shiftStartInput.value;
    calculateSchedule();
    saveData();
  }

  function setCurrentAsOfficial() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    officialStartInput.value = `${hours}:${minutes}`;
    calculateSchedule();
    saveData();
  }

  function calculateSchedule() {
    const shiftVal = shiftStartInput.value;
    const officialVal = officialStartInput.value || shiftVal;

    if (officialVal) {
      const [oh, om] = officialVal.split(':').map(Number);
      const officialStart = new Date();
      officialStart.setHours(oh, om, 0, 0);

      const b1 = new Date(officialStart.getTime() + 2 * 3600000);         // +2 hrs
      const lunch = new Date(officialStart.getTime() + 4 * 3600000);      // +4 hrs
      const b2 = new Date(officialStart.getTime() + 6.25 * 3600000);     // +6h 15m

      document.getElementById('sched-b1').textContent = formatTime(b1);
      document.getElementById('sched-lunch').textContent = formatTime(lunch);
      document.getElementById('sched-b2').textContent = formatTime(b2);
    }

    if (shiftVal) {
      const [sh, sm] = shiftVal.split(':').map(Number);
      const shiftStart = new Date();
      shiftStart.setHours(sh, sm, 0, 0);

      const end = new Date(shiftStart.getTime() + (8.5 * 3600000));     // 8h shift + 30m lunch
      document.getElementById('sched-end').textContent = formatTime(end);
    }
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function initSupabase() {
    if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  }

  async function saveData() {
    const payload = {
      shiftStart: shiftStartInput.value,
      officialStart: officialStartInput.value,
      notificationsEnabled: notifyToggle.checked,
      completedBreaks: completedBreaks,
      lastUpdated: new Date().toISOString()
    };

    localStorage.setItem('breakTracker_state', JSON.stringify(payload));
    showSaveIndicator();

    if (supabaseClient) {
      try {
        await supabaseClient.from('shifts').upsert([{ 
          id: 1, 
          shift_start: payload.shiftStart,
          official_start: payload.officialStart,
          notifications_enabled: payload.notificationsEnabled,
          completed_breaks: JSON.stringify(payload.completedBreaks),
          updated_at: payload.lastUpdated
        }]);
      } catch (err) {
        console.error("Supabase sync error:", err);
      }
    }
  }

  async function loadSavedData() {
    let loaded = false;
    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient.from('shifts').select('*').eq('id', 1).single();
        if (data && !error) {
          if (data.shift_start) shiftStartInput.value = data.shift_start;
          if (data.official_start) officialStartInput.value = data.official_start;
          if (data.notifications_enabled !== undefined) notifyToggle.checked = data.notifications_enabled;
          if (data.completed_breaks) {
            try { completedBreaks = JSON.parse(data.completed_breaks); } catch(e){}
          }
          loaded = true;
        }
      } catch (e) {
        console.warn("Could not fetch from cloud, using local storage.", e);
      }
    }

    if (!loaded) {
      const raw = localStorage.getItem('breakTracker_state');
      if (raw) {
        try {
          const data = JSON.parse(raw);
          if (data.shiftStart) shiftStartInput.value = data.shiftStart;
          if (data.officialStart) officialStartInput.value = data.officialStart;
          if (data.notificationsEnabled !== undefined) notifyToggle.checked = data.notificationsEnabled;
          if (data.completedBreaks) completedBreaks = data.completedBreaks;
        } catch (e) {}
      }
    }
  }

  function showSaveIndicator() {
    saveIndicator.classList.add('active');
    setTimeout(() => saveIndicator.classList.remove('active'), 1500);
  }

  notifyToggle.addEventListener('change', async () => {
    if (notifyToggle.checked) {
      if (!("Notification" in window)) {
        alert("This browser does not support desktop notifications.");
        notifyToggle.checked = false;
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        alert("Notification permission denied.");
        notifyToggle.checked = false;
      }
    }
  });

  function sendNotification(title, body) {
    if (notifyToggle.checked && Notification.permission === "granted") {
      new Notification(title, { body, icon: "https://fav.farm/⏰" });
    }
    playChime();
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    } catch (e) {}
  }

  // Update button states & gray out completed options
  function updateControlsState() {
    const isRunning = !!timerInterval;

    // Inputs active when no timer is running
    document.querySelectorAll('.break-input').forEach(i => i.disabled = isRunning);

    if (isRunning) {
      // Gray out all buttons while timer is actively running
      document.querySelectorAll('.break-btn').forEach(b => b.disabled = true);
    } else {
      // When idle, keep completed breaks grayed out
      document.getElementById('btn-b1').disabled = !!completedBreaks.b1;
      document.getElementById('btn-lunch').disabled = !!completedBreaks.lunch;
      document.getElementById('btn-b2').disabled = !!completedBreaks.b2;
      document.getElementById('btn-custom').disabled = false;
    }
  }

  function startPresetBreak(durationMinutes, label, key) {
    activeBreakName = label;
    activeBreakKey = key;
    const now = new Date();
    targetEndTime = new Date(now.getTime() + durationMinutes * 60000);
    runTimer();
  }

  function startCustomBreak() {
    const timeVal = document.getElementById('custom-time').value;
    const duration = parseInt(document.getElementById('custom-duration').value, 10);

    if (!duration || duration <= 0) return alert("Enter a valid duration.");

    const now = new Date();
    let startTime = new Date();

    if (timeVal) {
      const [h, m] = timeVal.split(':').map(Number);
      startTime.setHours(h, m, 0, 0);
    }

    targetEndTime = new Date(startTime.getTime() + duration * 60000);

    if (targetEndTime <= now) {
      alert("Calculated break end time is in the past!");
      return;
    }

    activeBreakName = `Custom Break (${duration}m)`;
    activeBreakKey = "custom";
    runTimer();
  }

  function runTimer() {
    clearInterval(timerInterval);
    updateControlsState();
    
    function update() {
      const now = new Date();
      const diff = targetEndTime - now;

      if (diff <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        
        const finishTimeStr = formatTime(new Date());
        markBreakCompleted(finishTimeStr);

        timerDisplay.textContent = "00:00";
        timerLabel.textContent = `✓ ${activeBreakName} completed at ${finishTimeStr}!`;
        sendNotification(`${activeBreakName} Finished!`, `Completed at ${finishTimeStr}. Back to work!`);
        return;
      }

      const m = Math.floor(diff / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      timerLabel.textContent = `${activeBreakName} • Ends at ${formatTime(targetEndTime)}`;
    }

    update();
    timerInterval = setInterval(update, 1000);
  }

  function markBreakCompleted(timeStr) {
    if (activeBreakKey && activeBreakKey !== "custom") {
      completedBreaks[activeBreakKey] = timeStr;
    }
    updateControlsState();
    saveData();
  }

  function completeBreak() {
    if (!timerInterval && (!targetEndTime || targetEndTime <= new Date())) {
      alert("No active break to complete.");
      return;
    }
    clearInterval(timerInterval);
    timerInterval = null;

    const finishTimeStr = formatTime(new Date());
    markBreakCompleted(finishTimeStr);

    timerDisplay.textContent = "00:00";
    timerLabel.textContent = `✓ ${activeBreakName} completed at ${finishTimeStr}!`;
    playChime();
  }

  function resetBreaks() {
    clearInterval(timerInterval);
    timerInterval = null;
    activeBreakName = "";
    activeBreakKey = "";
    
    completedBreaks = { b1: null, lunch: null, b2: null };
    
    updateControlsState();
    timerDisplay.textContent = "00:00";
    timerLabel.textContent = "No active break";
    saveData();
  }
</script>
</body>
</html>

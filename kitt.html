<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Kitt Break Tracker</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{margin:0;background:#f1f5f9;color:#0f172a}main{max-width:800px;margin:auto;padding:20px}header,.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}nav{display:flex;gap:16px}a{color:#4f46e5;font-weight:700}h1{font-size:24px}h2{font-size:19px}input,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5e1}input{max-width:100%;box-sizing:border-box}button{background:#4f46e5;color:white;border:0;cursor:pointer}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:#dc2626}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.prefix{font-weight:700}.breaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px}.breaks label{display:grid;gap:5px;font-size:14px}.status{font-size:14px;color:#475569;margin-top:10px}.vehicle{border-top:1px solid #ddd;padding:16px 0}.vehicle:first-child{border:0}small{color:#64748b}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f8fafc}header,.card{background:#1e293b}input{background:#0f172a;color:white;border-color:#475569}.status,small{color:#cbd5e1}}</style></head><body><main><header><h1>🚘 Kitt Break Tracker</h1><nav><a href="./index.html">MA / ZIP Tracker</a><a href="./kitt.html">Kitt Tracker</a></nav></header><section class="card"><h2>Add vehicle</h2><form id="add" class="row"><span class="prefix">Kitt_</span><input id="number" type="text" pattern="[0-9]+" inputmode="numeric" placeholder="305" required aria-label="Kitt vehicle number"><button>Add vehicle</button></form><p><small>Vehicle schedules are saved on this device. Times are interpreted in your device's local timezone.</small></p><div class="row"><button id="install" class="secondary" type="button">Install App</button><button id="notify" class="secondary" type="button">Enable Notifications</button><button id="float" class="secondary" type="button">Floating Display</button></div><p id="feedback" role="status" class="status"></p></section><section class="card"><h2>Vehicles</h2><div id="vehicles"></div></section></main><script>
const KEY='kitt-break-tracker-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{};let deferredInstall=null;let notified=new Set();let pip=null;
const labels={first:'First Break',meal:'Lunch / Dinner',last:'Last Break'},feedback=document.getElementById('feedback');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function el(tag,attrs={},txt){const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;return e}
document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('number').value.trim();if(!/^\d+$/.test(n))return;if(data.some(x=>x.number===n)){feedback.textContent='That vehicle already exists.';return}data.push({number:n,first:'',meal:'',last:''});document.getElementById('number').value='';save();feedback.textContent='Kitt_'+n+' added.'});
function render(){const root=document.getElementById('vehicles');root.replaceChildren();if(!data.length)root.append(el('p',{},'No vehicles yet. Add a Kitt number above.'));for(const v of data){const section=el('section',{class:'vehicle'});const head=el('div',{class:'row'});head.append(el('h3',{},'Kitt_'+v.number));const remove=el('button',{class:'danger',type:'button'},'Remove');remove.onclick=()=>{if(confirm('Remove Kitt_'+v.number+'?')){data=data.filter(x=>x!==v);save()}};head.append(remove);section.append(head);const fields=el('div',{class:'breaks'});for(const [key,label] of Object.entries(labels)){const wrap=el('label',{},label),input=el('input',{type:'time','aria-label':label+' for Kitt_'+v.number});input.value=v[key]||'';input.addEventListener('change',()=>{v[key]=input.value;save()});wrap.append(input);fields.append(wrap)}section.append(fields);const status=el('div',{class:'status',id:'status-'+v.number});section.append(status);root.append(section)}tick()}
function nextEvent(){const now=new Date();return data.flatMap(v=>Object.entries(labels).filter(([k])=>v[k]).map(([k,label])=>{const d=new Date();const [h,m]=v[k].split(':').map(Number);d.setHours(h,m,0,0);return{date:d,name:'Kitt_'+v.number,label,key:k}})).filter(x=>x.date>now).sort((a,b)=>a.date-b.date)[0]}
function tick(){const now=new Date();for(const v of data){const s=document.getElementById('status-'+v.number);if(!s)continue;const upcoming=Object.entries(labels).filter(([k])=>v[k]).map(([k,label])=>{const d=new Date();const[h,m]=v[k].split(':').map(Number);d.setHours(h,m,0,0);return{d,label,key:k}}).filter(x=>x.d>now).sort((a,b)=>a.d-b.d)[0];s.textContent=upcoming?'Next: '+upcoming.label+' in '+Math.ceil((upcoming.d-now)/60000)+' min':'No more scheduled breaks today';for(const [k,label] of Object.entries(labels)){if(!v[k])continue;const id=now.toDateString()+':'+v.number+':'+k+':'+v[k];const [h,m]=v[k].split(':').map(Number);const due=new Date();due.setHours(h,m,0,0);if(now>=due&&now-due<60000&&!notified.has(id)){notified.add(id);if(Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('Kitt_'+v.number+' • '+label,{body:'Scheduled break time',icon:'./icon.svg',tag:id})).catch(()=>new Notification('Kitt_'+v.number+' • '+label));}}}}if(pip&&!pip.closed){const e=nextEvent();pip.document.getElementById('live').textContent=e?e.name+' — '+e.label+'\n'+Math.ceil((e.date-now)/60000)+' minutes remaining':'No more scheduled breaks today'}}
document.getElementById('notify').onclick=async()=>{if(!('Notification'in window)){feedback.textContent='Notifications unavailable in this browser.';return}const p=await Notification.requestPermission();feedback.textContent=p==='granted'?'Notifications enabled while the app is running.':'Notification permission: '+p};
document.getElementById('float').onclick=async()=>{if(!window.documentPictureInPicture){feedback.textContent='Floating display needs a supporting desktop browser such as Chrome or Edge.';return}try{pip=await documentPictureInPicture.requestWindow({width:360,height:160});pip.document.body.style='background:#111827;color:white;font:600 22px system-ui;padding:20px';const div=pip.document.createElement('div');div.id='live';div.style.whiteSpace='pre-line';pip.document.body.append(div);tick()}catch(e){feedback.textContent=e.message}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});document.getElementById('install').onclick=async()=>{if(deferredInstall){await deferredInstall.prompt();deferredInstall=null}else feedback.textContent='Use your browser menu: Add to Home Screen or Install app.'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);render();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script></body></html>

<!doctype html><html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Kitt Break Tracker</title><style>:root{--bg:#f8fafc;--card-bg:#fff;--text:#0f172a;--text-muted:#64748b;--primary:#4f46e5;--primary-hover:#4338ca;--accent:#10b981;--border:#e2e8f0;--item-bg:#f1f5f9;--highlight-bg:#eef2ff;--highlight-border:#c7d2fe;--input-bg:#fff;--radius:12px;--shadow:0 4px 6px -1px #0001} [data-theme="dark"]{--bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--primary:#6366f1;--primary-hover:#4f46e5;--border:#334155;--item-bg:#334155;--highlight-bg:#1e1b4b;--highlight-border:#3730a3;--input-bg:#0f172a} @media(prefers-color-scheme:dark){[data-theme="auto"]{--bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--primary:#6366f1;--border:#334155;--item-bg:#334155;--highlight-bg:#1e1b4b;--highlight-border:#3730a3;--input-bg:#0f172a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;padding:2rem 1rem}main{max-width:600px;margin:auto;display:flex;flex-direction:column;gap:1.25rem}header,.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:0 0 1rem}h3{margin:.5rem 0;font-size:1.05rem}nav{display:flex;gap:10px;background:var(--item-bg);border:1px solid var(--border);padding:5px;border-radius:10px}nav a{flex:1;text-align:center;text-decoration:none;color:var(--text-muted);padding:.6rem .3rem;border-radius:8px;font-size:.85rem;font-weight:700}nav a.active{color:var(--primary);background:var(--card-bg);box-shadow:0 1px 3px #0002}input,button,select{font:inherit;border-radius:8px;padding:.65rem .8rem}input,select{border:1px solid var(--border);background:var(--input-bg);color:var(--text);min-width:0}button{background:var(--primary);color:white;border:0;cursor:pointer;font-weight:600}button:hover{filter:brightness(.94)}button.secondary{background:var(--item-bg);color:var(--text);border:1px solid var(--border)}button.danger{background:#ef4444}.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.prefix{font-weight:700}.breaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-top:1rem}.breaks label{display:flex;flex-direction:column;gap:.5rem;background:var(--item-bg);padding:.75rem;border-radius:8px;color:var(--text-muted);font-size:.8rem;font-weight:600}.breaks input{width:100%;font-weight:600}.status{font-size:.85rem;color:var(--text-muted);margin-top:12px}.vehicle{border-top:1px solid var(--border);padding:18px 0}.vehicle:first-child{border:0}small{color:var(--text-muted)}.timer-display{text-align:center;background:var(--highlight-bg);border:1px solid var(--highlight-border);padding:1rem;border-radius:8px;margin-top:1rem}.timer-time{font-size:2.3rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}.timer-label{color:var(--text-muted);font-size:.85rem}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}.actions button{flex:1}#number{width:110px}.theme-select{font-size:.8rem;padding:.4rem}#live-popup{position:fixed;bottom:18px;right:18px;z-index:9999;max-width:min(340px,calc(100vw - 36px));background:var(--card-bg);border:2px solid var(--primary);border-radius:14px;box-shadow:0 12px 40px #0005;padding:15px;display:none}#live-popup.visible{display:block}#live-popup .clock{font-size:2rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}#live-popup .row{justify-content:space-between}#live-popup button{padding:6px 10px}
/* Compact mobile-first layout */
body{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
.container,main{width:100%;min-width:0;gap:12px}header,.card{padding:16px;box-shadow:none;border-radius:14px}header{gap:8px}h1{font-size:1.1rem;letter-spacing:-.02em}.card-header{gap:10px}.card-title{font-size:.95rem}.settings-wrap{position:relative;margin-left:auto}.settings-trigger{width:40px;height:40px;display:grid;place-items:center;font-size:1.25rem;padding:0}.settings-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,calc(100vw - 32px));z-index:20;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 12px 32px #0002;display:flex;flex-direction:column;gap:12px}.settings-panel[hidden]{display:none!important}.settings-panel .setting-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.settings-panel select{max-width:150px}.settings-panel button{width:100%}.tracker-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.tracker-heading button{font-size:.75rem;white-space:nowrap;padding:8px 10px}.grid-2>*{min-width:0}.schedule-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.schedule-item{min-width:0}.schedule-item input{min-width:0;max-width:100%}.btn-group button{min-width:0;padding:10px 4px;font-size:.76rem}.custom-break{min-width:0}.custom-break input{min-width:0}.custom-break input[type=number]{flex:0 0 66px!important;width:66px!important}.tab-bar{min-width:0}.tab-btn{min-width:0;font-size:.77rem;padding:10px 6px}nav a{min-width:0;font-size:.8rem}input,select,button{max-width:100%}input[type=time],input[type=number],input[type=text]{font-size:16px}@media(max-width:390px){header,.card{padding:13px}.timer-time{font-size:2.2rem}.schedule-grid{gap:8px}.grid-2{gap:8px}.tracker-heading button{font-size:.7rem}.btn-group{gap:5px}}
 .breaks{grid-template-columns:repeat(2,minmax(0,1fr))}.breaks label{min-width:0}.breaks input{min-width:0}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{min-width:0;font-size:.8rem}.row>*{min-width:0}#live-popup{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:340px;margin-left:auto}@media(max-width:390px){.breaks{gap:8px}.actions{gap:6px}}
.floating-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:36px;flex:0 0 auto;padding:7px!important}.floating-icon-btn svg{display:block;pointer-events:none}
</style></head><body><main><header><h1>Shift & Break Tracker</h1><div class="settings-wrap"><button class="secondary settings-trigger" id="settings-trigger" type="button" aria-label="Settings" aria-expanded="false" onclick="toggleSettings()">⚙</button><div class="settings-panel" id="settings-panel" hidden><strong>Settings</strong><button class="secondary" type="button" onclick="location.reload()">↻ Refresh</button><div class="setting-line"><label for="theme-select">Appearance</label><select id="theme-select" class="theme-select" aria-label="Theme"><option value="auto">💻 System</option><option value="light">☀️ Light</option><option value="dark">🌙 Dark</option></select></div><button id="notify" class="secondary" type="button">Enable Notifications</button><button id="install" class="secondary" type="button">Install App</button></div></div></header><nav><a href="./index.html">🚘 MA / ZIP</a><a href="./kitt.html" class="active">🚗 Kitt Tracker</a></nav><section class="card"><h2>Kitt Shift Setup</h2><form id="add" class="row"><span class="prefix">Kitt_</span><input id="number" type="text" pattern="[0-9]+" inputmode="numeric" placeholder="305" required aria-label="Kitt vehicle number"><button>Add vehicle</button></form><p><small>Vehicle schedules are saved on this device. Times are interpreted in your device's local timezone.</small></p><p id="feedback" role="status" class="status"></p></section><section class="card"><div class="tracker-heading"><h2>Active Kitt Break Tracker</h2><button id="float" class="secondary floating-icon-btn" type="button" aria-label="Floating Timer" title="Floating Timer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><rect x="11.5" y="11.5" width="7" height="5.5" rx="1" fill="currentColor" stroke="none"/></svg></button></div><div id="vehicles"></div></section></main><aside id="live-popup" role="status" aria-live="off"><div class="row"><strong id="popup-title">Active break</strong><button class="secondary" type="button" onclick="document.getElementById('live-popup').classList.remove('visible')">✕</button></div><div class="clock" id="popup-clock">00:00</div><small id="popup-subtitle">Break running</small></aside><script>
function toggleSettings(){const p=document.getElementById('settings-panel');p.hidden=!p.hidden;document.getElementById('settings-trigger').setAttribute('aria-expanded',String(!p.hidden))}document.addEventListener('click',e=>{const wrap=document.querySelector('.settings-wrap');if(wrap&&!wrap.contains(e.target)){document.getElementById('settings-panel').hidden=true;document.getElementById('settings-trigger').setAttribute('aria-expanded','false')}});
const KEY='kitt-break-tracker-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{};let deferredInstall=null;let notified=new Set();let pip=null;
const themeSelect=document.getElementById('theme-select');themeSelect.value=localStorage.getItem('theme_pref')||'auto';document.documentElement.dataset.theme=themeSelect.value;themeSelect.onchange=()=>{document.documentElement.dataset.theme=themeSelect.value;localStorage.setItem('theme_pref',themeSelect.value)};
const labels={first:'First Break',meal:'Lunch / Dinner',last:'Last Break'},feedback=document.getElementById('feedback');
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function el(tag,attrs={},txt){const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;return e}
document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('number').value.trim();if(!/^\d+$/.test(n))return;if(data.some(x=>x.number===n)){feedback.textContent='That vehicle already exists.';return}data.push({number:n,first:'',meal:'',last:''});document.getElementById('number').value='';save();feedback.textContent='Kitt_'+n+' added.'});
function render(){const root=document.getElementById('vehicles');root.replaceChildren();if(!data.length)root.append(el('p',{},'No vehicles yet. Add a Kitt number above.'));for(const v of data){const section=el('section',{class:'vehicle'});const head=el('div',{class:'row'});head.append(el('h3',{},'Kitt_'+v.number));const remove=el('button',{class:'danger',type:'button'},'Remove');remove.onclick=()=>{if(confirm('Remove Kitt_'+v.number+'?')){data=data.filter(x=>x!==v);save()}};head.append(remove);section.append(head);const fields=el('div',{class:'breaks'});for(const [key,label] of Object.entries(labels)){const wrap=el('label',{},label),input=el('input',{type:'time','aria-label':label+' for Kitt_'+v.number});input.value=v[key]||'';input.addEventListener('change',()=>{v[key]=input.value;save()});wrap.append(input);fields.append(wrap)}section.append(fields);const timer=el('div',{class:'timer-display'}),time=el('div',{class:'timer-time',id:'timer-'+v.number},'00:00'),timerLabel=el('div',{class:'timer-label',id:'timer-label-'+v.number},'No active break');timer.append(time,timerLabel);section.append(timer);const actions=el('div',{class:'actions'});for(const [key,label,duration] of [['first','First Break',15],['meal','Lunch / Dinner',30],['last','Last Break',15]]){const start=el('button',{type:'button'},label+' ('+duration+'m)');start.onclick=()=>{v.active={key,label,end:Date.now()+duration*60000,warned:false};save();showLivePopup(v);notifyBreakStarted(v);window.AndroidBreakTracker?.startBreak('Kitt_'+v.number+' • '+label,v.active.end)};actions.append(start)}const finish=el('button',{class:'secondary',type:'button'},'✓ Complete');finish.onclick=()=>{if(v.active){v.completed=v.completed||{};v.completed[v.active.key]=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});delete v.active;window.AndroidBreakTracker?.stopBreak();save()}};const reset=el('button',{class:'danger',type:'button'},'Reset');reset.onclick=()=>{if(confirm('Reset breaks for Kitt_'+v.number+'?')){delete v.active;v.completed={};window.AndroidBreakTracker?.stopBreak();save()}};actions.append(finish,reset);section.append(actions);const status=el('div',{class:'status',id:'status-'+v.number});section.append(status);root.append(section)}tick()}
function showLivePopup(v){document.getElementById('live-popup').dataset.vehicle=v.number;document.getElementById('live-popup').classList.add('visible');updateLivePopup()}
function updateLivePopup(){const box=document.getElementById('live-popup');const v=data.find(x=>x.number===box.dataset.vehicle);if(!v?.active||v.active.end<=Date.now()){box.classList.remove('visible');return}const secs=Math.max(0,Math.ceil((v.active.end-Date.now())/1000));document.getElementById('popup-title').textContent='Kitt_'+v.number+' • '+v.active.label;document.getElementById('popup-clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('popup-subtitle').textContent='Ends at '+new Date(v.active.end).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
async function notifyBreakStarted(v){if(!('Notification'in window)||Notification.permission!=='granted'){feedback.textContent='Timer started. Enable notifications for an Android notification.';return}try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('Kitt_'+v.number+' • '+v.active.label+' started',{body:'Ends at '+new Date(v.active.end).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),icon:'./icon.svg',tag:'active-kitt-'+v.number,renotify:true});}catch(e){feedback.textContent='Timer started. Notification unavailable: '+e.message}}
async function warnBreakEnding(v){const mins=Math.ceil((v.active.end-Date.now())/60000);const message='⚠️ '+v.active.label+' ends in about '+mins+' minutes';feedback.textContent='Kitt_'+v.number+': '+message;showLivePopup(v);if('Notification'in window&&Notification.permission==='granted'&&'serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('⚠️ Kitt_'+v.number+' • Break almost over',{body:message,icon:'./icon.svg',tag:'kitt-warning-'+v.number+'-'+v.active.end,renotify:true,vibrate:[200,100,200]})}catch(e){console.warn('Reminder notification unavailable',e)}}}
function nextEvent(){const now=new Date();return data.flatMap(v=>Object.entries(labels).filter(([k])=>v[k]).map(([k,label])=>{const d=new Date();const [h,m]=v[k].split(':').map(Number);d.setHours(h,m,0,0);return{date:d,name:'Kitt_'+v.number,label,key:k}})).filter(x=>x.date>now).sort((a,b)=>a.date-b.date)[0]}
function tick(){updateLivePopup();const now=new Date();for(const v of data){const s=document.getElementById('status-'+v.number);if(!s)continue;const upcoming=Object.entries(labels).filter(([k])=>v[k]).map(([k,label])=>{const d=new Date();const[h,m]=v[k].split(':').map(Number);d.setHours(h,m,0,0);return{d,label,key:k}}).filter(x=>x.d>now).sort((a,b)=>a.d-b.d)[0];const timer=document.getElementById('timer-'+v.number),timerLabel=document.getElementById('timer-label-'+v.number);if(v.active&&v.active.end>Date.now()){if(!v.active.warned&&v.active.end-Date.now()<=3*60000){v.active.warned=true;localStorage.setItem(KEY,JSON.stringify(data));warnBreakEnding(v)}const remaining=Math.max(0,Math.ceil((v.active.end-Date.now())/1000));timer.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');timerLabel.textContent=v.active.label+' • Active';}else if(v.active){const finished=v.active;v.completed=v.completed||{};v.completed[finished.key]=new Date(finished.end).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});delete v.active;localStorage.setItem(KEY,JSON.stringify(data));timer.textContent='00:00';timerLabel.textContent=finished.label+' completed';}else{timer.textContent='00:00';timerLabel.textContent='No active break';}s.textContent=upcoming?'Next: '+upcoming.label+' in '+Math.ceil((upcoming.d-now)/60000)+' min':'No more scheduled breaks today';for(const [k,label] of Object.entries(labels)){if(!v[k])continue;const id=now.toDateString()+':'+v.number+':'+k+':'+v[k];const [h,m]=v[k].split(':').map(Number);const due=new Date();due.setHours(h,m,0,0);if(now>=due&&now-due<60000&&!notified.has(id)){notified.add(id);if(Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('Kitt_'+v.number+' • '+label,{body:'Scheduled break time',icon:'./icon.svg',tag:id})).catch(()=>new Notification('Kitt_'+v.number+' • '+label));}}}}if(pip&&!pip.closed){const e=nextEvent();pip.document.getElementById('live').textContent=e?e.name+' — '+e.label+'\n'+Math.ceil((e.date-now)/60000)+' minutes remaining':'No more scheduled breaks today'}}
document.getElementById('notify').onclick=async()=>{if(!('Notification'in window)){feedback.textContent='Notifications unavailable in this browser.';return}const p=await Notification.requestPermission();feedback.textContent=p==='granted'?'Notifications enabled while the app is running.':'Notification permission: '+p};
function drawMobileFloatingTimer(){const p=document.getElementById('mobile-float');if(p.hidden)return;const active=data.find(v=>v.active&&v.active.end>Date.now());document.getElementById('mobile-float-time').textContent=active?String(Math.floor((active.active.end-Date.now())/60000)).padStart(2,'0')+':'+String(Math.ceil((active.active.end-Date.now())/1000)%60).padStart(2,'0'):'00:00';document.getElementById('mobile-float-label').textContent=active?'Kitt_'+active.number+' • '+active.active.label:'No active break'}setInterval(drawMobileFloatingTimer,1000);document.getElementById('float').onclick=async()=>{if(!window.documentPictureInPicture){const p=document.getElementById('mobile-float');p.hidden=!p.hidden;drawMobileFloatingTimer();return}try{pip=await documentPictureInPicture.requestWindow({width:360,height:160});pip.document.body.style='background:#111827;color:white;font:600 22px system-ui;padding:20px';const div=pip.document.createElement('div');div.id='live';div.style.whiteSpace='pre-line';pip.document.body.append(div);tick()}catch(e){document.getElementById('mobile-float').hidden=false;drawMobileFloatingTimer()}};
function installHelp(){const ua=navigator.userAgent;const samsung=/SamsungBrowser/i.test(ua);if(samsung)return 'Samsung Internet: tap the browser menu (☰), choose Add page to, then Home screen (or Apps, if offered). Confirm Add. If the option is missing, open the site directly in Samsung Internet over HTTPS.';if(/Android/i.test(ua))return 'Android Chrome: tap ⋮ and choose Install app or Add to Home screen. Open the website directly over HTTPS.';if(/iPhone|iPad/i.test(ua))return 'Safari: tap Share, then Add to Home Screen.';return 'Use your browser menu to install or add this website to your home screen.';}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;feedback.textContent='App installation is ready.'});window.addEventListener('appinstalled',()=>{deferredInstall=null;feedback.textContent='App installed successfully.'});document.getElementById('install').onclick=async()=>{if(window.matchMedia('(display-mode: standalone)').matches){feedback.textContent='The app is already installed.';return}if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}else feedback.textContent=installHelp()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);render();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script><style id="mobile-floating-style">.mobile-float{position:fixed;z-index:9998;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;margin:0 auto;max-width:340px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px #0004}.mobile-float[hidden]{display:none}.mobile-float-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.mobile-float-time{font-size:2.2rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;text-align:center}.mobile-float-label{font-size:.85rem;color:var(--text-muted);text-align:center}.mobile-float button{padding:5px 10px}</style><aside id="mobile-float" class="mobile-float" hidden role="status" aria-live="off"><div class="mobile-float-head"><strong>Floating Timer</strong><button type="button" class="secondary" onclick="document.getElementById('mobile-float').hidden=true" aria-label="Close floating timer">✕</button></div><div class="mobile-float-time" id="mobile-float-time">00:00</div><div class="mobile-float-label" id="mobile-float-label">No active break</div></aside></body></html>

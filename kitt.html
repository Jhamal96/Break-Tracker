function toggleSettings(){const p=document.getElementById('settings-panel');p.hidden=!p.hidden;document.getElementById('settings-trigger').setAttribute('aria-expanded',String(!p.hidden))}document.addEventListener('click',e=>{const wrap=document.querySelector('.settings-wrap');if(wrap&&!wrap.contains(e.target)){document.getElementById('settings-panel').hidden=true;document.getElementById('settings-trigger').setAttribute('aria-expanded','false')}});

function updateStyledPiP(w,seconds,totalSeconds,label){
  if(w.closed)return;
  const d=w.document;
  const remain=Math.max(0,seconds);
  const time=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');
  const active=seconds>0;
  const status=!active?'Ready when you are':remain<=180?'3 MINUTE WARNING':'Break in progress';
  const percent=active&&totalSeconds>0?Math.max(0,Math.min(100,(remain/totalSeconds)*100)):0;
  d.querySelectorAll('[data-pip-time]').forEach(node=>node.textContent=time);
  d.querySelectorAll('[data-pip-label]').forEach(node=>node.textContent=active?label:'No active break');
  d.querySelectorAll('[data-pip-status]').forEach(node=>node.textContent=status);
  d.querySelectorAll('[data-pip-bar]').forEach(node=>node.style.width=percent+'%');
  d.getElementById('pip-dial').style.background='conic-gradient(#38bdf8 '+percent+'%,#334155 '+percent+'%)';
  d.getElementById('pip-gauge-fill').style.strokeDasharray=(301.6*percent/100)+' 302';
  d.documentElement.style.setProperty('--pip-pct',percent+'%');
  const digits=time.replace(':','');
  d.querySelectorAll('[data-pip-digit]').forEach(node=>node.textContent=digits[Number(node.dataset.pipDigit)]||'0');
  d.body.classList.toggle('pip-warning',active&&remain<=180);
}
document.getElementById('float').onclick=async()=>{
  if(!window.documentPictureInPicture){
    const p=document.getElementById('mobile-float');p.hidden=!p.hidden;drawMobileFloatingTimer();return;
  }
  try{
    pip=await documentPictureInPicture.requestWindow({width:370,height:225});
    createStyledPiP(pip);
    const w=pip;
    const draw=()=>{
      if(w.closed)return;
      const v=data.find(x=>x.active&&x.active.end>Date.now());
      const seconds=v?Math.max(0,Math.ceil((v.active.end-Date.now())/1000)):0;
      const duration=v&&v.active.key==='meal'?30:15;
      updateStyledPiP(w,seconds,duration*60,v?'Kitt_'+v.number+' · '+v.active.label:'No active break');
    };
    draw();
    const id=setInterval(()=>{if(w.closed)clearInterval(id);else draw()},1000);
  }catch(e){
    const p=document.getElementById('mobile-float');p.hidden=false;drawMobileFloatingTimer();
  }
};

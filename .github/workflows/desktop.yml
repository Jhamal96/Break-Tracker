name: Build Windows and Mac desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: desktop-windows
          - os: macos-latest
            script: dist:mac
            artifact: desktop-mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe\n            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish test installers
    needs: installers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Publish assets to reusable desktop-latest Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist/
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist/*.exe dist/*.dmg --clobber
          else
            gh release create desktop-latest dist/*.exe dist/*.dmg \
              --target "$GITHUB_SHA" --title "Break Tracker — Windows & macOS" \
              --notes "Unsigned test desktop installers. Download the Windows .exe or Mac .dmg from Assets. On first launch, the operating system may require manual confirmation." --prerelease
          fi

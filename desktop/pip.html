<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Break Tracker — Floating Timer</title>
<style>
  :root{color-scheme:dark;--background:#111a31;--panel:#172644;--accent:#7dd3fc;--text:#f8fafc;--muted:#bed0ee;--rail:#344463;--corner:17px}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{font:13px/1.4 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--background);color:var(--text);user-select:none;-webkit-user-select:none}
  .shell{height:100vh;width:100vw;padding:9px 13px 10px;display:flex;flex-direction:column;gap:3px;border:1px solid #ffffff21;border-radius:13px;overflow:hidden;background:radial-gradient(ellipse at 85% 17%,#ffffff12,transparent 65%)}
  .header{display:flex;align-items:center;justify-content:space-between;min-height:27px;-webkit-app-region:drag}
  .brand{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent)}
  .brand svg{height:13px;width:13px}
  .close{height:26px;width:27px;display:grid;place-items:center;font-size:19px;line-height:1;background:#ffffff18;border:1px solid #ffffff25;border-radius:8px;color:var(--text);cursor:pointer;-webkit-app-region:no-drag}
  .close:hover{background:#ffffff32}
  .clockface{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:center;align-items:center;position:relative;text-align:center;gap:3px}
  .eyebrow{font-size:9px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:2px}
  .clock{font-size:clamp(32px,10vw,58px);font-weight:850;letter-spacing:-1.8px;font-variant-numeric:tabular-nums;line-height:1.14;position:relative;z-index:1;text-shadow:0 2px 12px #0004}
  .label{max-width:98%;font-size:11px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:33px}
  .status{font-size:10px;font-weight:750;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:4px;background:var(--rail);border-radius:10px;overflow:hidden;position:absolute;bottom:3px;width:86%}
  .bar>span{display:block;width:0;height:100%;background:var(--accent);transition:width .5s}
  .style-control{display:flex;align-items:center;gap:5px;max-width:52%;-webkit-app-region:no-drag}
  .style-control label{color:var(--muted);font-size:10px;font-weight:750}
  select{font-size:11px;font-weight:750;min-width:0;max-width:140px;height:28px;color:var(--text);background:var(--panel);border-radius:8px;border:1px solid #ffffff3b;padding:0 5px;cursor:pointer}
  option{color:#0f172a;background:#fff}
  .dial,.arc,.flip-clock{display:none}
  .ring{height:115px;width:115px;padding:7px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,0%),var(--rail) var(--pct,0%));display:flex;justify-content:center;align-items:center;box-shadow:0 0 20px #ffffff12}
  .ring-interior{width:100%;height:100%;background:var(--background);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .ring-interior .clock{font-size:28px}
  .ring-interior .eyebrow{font-size:8px;letter-spacing:1px}
  .gauge{width:226px;height:91px;overflow:visible}
  .gauge path{fill:none;stroke-width:11;stroke-linecap:round}
  .gauge .track{stroke:var(--rail)}
  .gauge .fill{stroke:var(--accent);stroke-dasharray:0 286;transition:stroke-dasharray .5s}
  .arc .clock{font-size:43px;margin-top:-33px}
  .flip-clock{gap:5px;align-items:center;justify-content:center;margin:11px 0}
  .flip-clock span{display:inline-flex;width:44px;height:61px;align-items:center;justify-content:center;border:1px solid #66708488;border-radius:7px;background:linear-gradient(#ffffff26 49%,#ffffff11 50%);box-shadow:0 4px 0 #0005;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
  .flip-clock b{font-size:32px;color:var(--accent)}
  body[data-style=dial] .dial,body[data-style=orbit] .dial{display:flex}
  body[data-style=dial] .standard-clock,body[data-style=orbit] .standard-clock{display:none}
  body[data-style=speedometer] .arc{display:flex;flex-direction:column;align-items:center}
  body[data-style=speedometer] .standard-clock{display:none}
  body[data-style=flip] .flip-clock{display:flex}
  body[data-style=flip] .standard-clock{display:none}
  body[data-style=dial] .bar,body[data-style=orbit] .bar,body[data-style=speedometer] .bar,body[data-style=flip] .bar{display:none}
  body[data-style=dial] .label,body[data-style=orbit] .label{font-size:10px}
  body[data-style=minimal]{--background:#f6f6f2;--panel:#e0e5e5;--accent:#415b63;--text:#1c303b;--muted:#61737b;--rail:#d4dedc;color-scheme:light}
  body[data-style=minimal] .shell,body[data-style=zen] .shell{border-color:#17212a20;background:transparent}
  body[data-style=minimal] .clock{font-weight:500;font-size:62px;letter-spacing:-3px;text-shadow:none}
  body[data-style=neon]{--background:#1a092d;--panel:#35144c;--accent:#f0abfc;--muted:#b4f7fb;--rail:#57356d}
  body[data-style=neon] .clock{text-shadow:0 0 12px #e879f9aa;color:#e9a6fe}
  body[data-style=neon] .clockface:before{content:"";position:absolute;width:min(280px,88%);height:90px;border:1px solid #d946ef88;border-radius:15px;box-shadow:inset 0 0 15px #d946ef2a,0 0 18px #c026d34a}
  body[data-style=aurora]{--background:#154d69;--panel:#2d6781;--accent:#a7f3d0;--text:#fff;--muted:#d2f7ef;--rail:#ffffff33}
  body[data-style=aurora] .shell{background:radial-gradient(ellipse at 0% 0%,#16a38a7a,transparent 70%),radial-gradient(ellipse at 90% 90%,#6d28d982,transparent 70%)}
  body[data-style=aurora] .clockface:before{content:"";position:absolute;width:min(300px,94%);height:115px;border:1px solid #ffffff6a;border-radius:17px;background:#ffffff1e;box-shadow:inset 0 1px #ffffff5a;backdrop-filter:blur(6px)}
  body[data-style=flip]{--background:#171c26;--panel:#283143;--accent:#fde047;--muted:#cbd5e1}
  body[data-style=racing]{--background:#11131d;--panel:#32303b;--accent:#fb923c;--muted:#fed7aa}
  body[data-style=racing] .clock{font-style:italic;transform:skewX(-7deg);text-shadow:3px 3px #9a3412}
  body[data-style=racing] .bar{height:9px;border-radius:0;transform:skewX(-17deg);background:repeating-linear-gradient(90deg,#334155 0 16px,#10131e 16px 21px)}
  body[data-style=racing] .bar>span{background:linear-gradient(90deg,#fb923c,#ef4444)}
  body[data-style=orbit]{--background:#0e122b;--panel:#262a54;--accent:#c4b5fd;--muted:#e1dcff;--rail:#39436c}
  body[data-style=orbit] .ring{box-shadow:0 0 0 9px #a78bfa0e,0 0 24px #a78bfa38}
  body[data-style=sunset]{--background:#713b61;--panel:#a45d6c;--accent:#ffe3aa;--muted:#fff1e2;--rail:#e9a37c}
  body[data-style=sunset] .shell{background:linear-gradient(140deg,#703361,#b66178 64%,#e99c65)}
  body[data-style=sunset] .clockface:before{content:"";position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:148px;height:148px;border-radius:50%;background:radial-gradient(circle,#ffe3a9,#ffc17d 70%,#fca172);opacity:.72}
  body[data-style=sunset] .clock{text-shadow:0 3px 12px #4b1a37}
  body[data-style=pixel]{--background:#0b231c;--panel:#194635;--accent:#86efac;--muted:#bbf7d0;--rail:#14532d}
  body[data-style=pixel] .shell{background-image:linear-gradient(#4ade8011 1px,transparent 1px),linear-gradient(90deg,#4ade8011 1px,transparent 1px);background-size:16px 16px}
  body[data-style=pixel] .clock{font-family:ui-monospace,monospace;letter-spacing:1px;text-shadow:3px 3px #166534}
  body[data-style=pixel] .bar{border-radius:0;height:7px}
  body[data-style=zen]{--background:#faf6ed;--panel:#e8ebdf;--accent:#647d60;--text:#374d3f;--muted:#6f806e;--rail:#dce4d9;color-scheme:light}
  body[data-style=zen] .clock{font-family:Georgia,serif;font-weight:400;text-shadow:none}
  body[data-style=zen] .eyebrow{font-family:Georgia,serif}
  body[data-style=ocean]{--background:#082c42;--panel:#195369;--accent:#67e8f9;--muted:#c6f5fe;--rail:#22647d}
  body[data-style=ocean] .shell{background:radial-gradient(ellipse at 50% 120%,#0e7490aa,transparent 79%)}
  body[data-style=ocean] .clockface:before{content:"";position:absolute;width:min(280px,92%);height:97px;border:1px solid #67e8f97a;border-radius:50%;box-shadow:inset 0 0 35px #67e8f921,0 0 22px #67e8f915}
  body[data-style=blueprint]{--background:#16325a;--panel:#1f4770;--accent:#bfdbfe;--muted:#dbeafe;--rail:#41688d}
  body[data-style=blueprint] .shell{background-image:linear-gradient(#a3c6f11d 1px,transparent 1px),linear-gradient(90deg,#a3c6f11d 1px,transparent 1px);background-size:22px 22px}
  body[data-style=blueprint] .clock{font-family:ui-monospace,monospace;font-weight:750}
  body[data-warning=true]{--accent:#fca5a5}
  @media(max-height:185px){.shell{padding-top:5px;padding-bottom:4px;gap:0}.header{min-height:23px}.clock{font-size:39px}.ring{height:94px;width:94px}.bar{bottom:0}.bottom{min-height:27px}.eyebrow{font-size:8px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-style="digital" data-warning="false">
<div class="shell">
  <header class="header">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>Break Tracker</div>
    <button class="close" id="close" type="button" title="Close floating timer" aria-label="Close floating timer">×</button>
  </header>
  <section class="clockface" aria-label="Break countdown">
    <div class="eyebrow" id="eyebrow">TIME REMAINING</div>
    <div class="standard-clock clock" id="time" role="timer" aria-live="off">00:00</div>
    <div class="dial"><div class="ring" id="ring"><div class="ring-interior"><span class="clock" id="dial-time">00:00</span><span class="eyebrow">LEFT</span></div></div></div>
    <div class="arc"><svg class="gauge" viewBox="0 0 240 120" aria-hidden="true"><path class="track" d="M25 109 A95 95 0 0 1 215 109"/><path id="gauge-fill" class="fill" d="M25 109 A95 95 0 0 1 215 109"/></svg><div class="clock" id="arc-time">00:00</div></div>
    <div class="flip-clock" aria-hidden="true"><span data-digit="0">0</span><span data-digit="1">0</span><b>:</b><span data-digit="2">0</span><span data-digit="3">0</span></div>
    <div class="label" id="label">Start a break to begin</div>
    <div class="bar" aria-hidden="true"><span id="progress"></span></div>
  </section>
  <footer class="bottom">
    <span class="status" id="status">Ready when you are</span>
    <div class="style-control"><label for="style">Style</label>
      <select id="style" title="Choose floating countdown design" aria-label="Countdown style">
        <option value="digital">Digital</option><option value="dial">Clock Dial</option>
        <option value="speedometer">Speedometer</option><option value="minimal">Minimal</option>
        <option value="neon">Neon Pulse</option><option value="aurora">Aurora Glass</option>
        <option value="flip">Retro Flip</option><option value="racing">Racing HUD</option>
        <option value="orbit">Cosmic Orbit</option><option value="sunset">Sunset Glow</option>
        <option value="pixel">Pixel Arcade</option><option value="zen">Zen Garden</option>
        <option value="ocean">Ocean Depths</option><option value="blueprint">Blueprint</option>
      </select>
    </div>
  </footer>
</div>
<script>
  const state={end:0,totalSeconds:900,label:'No active break'};
  const style=document.getElementById('style');
  let selected='digital';
  try { selected=localStorage.getItem('ajd-native-pip-style-v1')||'digital'; } catch (_) {}
  if (![...style.options].some(o=>o.value===selected)) selected='digital';
  style.value=selected;
  document.body.dataset.style=selected;
  style.addEventListener('change',()=>{
    document.body.dataset.style=style.value;
    try { localStorage.setItem('ajd-native-pip-style-v1',style.value); } catch (_) {}
    update();
  });
  document.getElementById('close').addEventListener('click',()=>window.ajdNativeMiniTimer?.close());
  window.ajdNativeMiniTimer?.onState(next=>{
    if (!next || typeof next!=='object') return;
    state.end=Number(next.end)||0;
    state.totalSeconds=Math.max(1,Number(next.totalSeconds)||900);
    state.label=String(next.label||'No active break').slice(0,120);
    update();
  });
  function update(){
    const active=state.end>Date.now();
    const complete=state.end>0&&!active;
    const seconds=active?Math.max(0,Math.ceil((state.end-Date.now())/1000)):0;
    const formatted=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    const percentage=active?Math.max(0,Math.min(100,seconds/state.totalSeconds*100)):0;
    document.documentElement.style.setProperty('--pct',percentage+'%');
    document.getElementById('time').textContent=formatted;
    document.getElementById('dial-time').textContent=formatted;
    document.getElementById('arc-time').textContent=formatted;
    const digits=formatted.replace(':','');
    document.querySelectorAll('[data-digit]').forEach(el=>el.textContent=digits[Number(el.dataset.digit)]||'0');
    document.getElementById('label').textContent=active?state.label:complete?'Break complete':'Start a break to begin';
    document.getElementById('status').textContent=active?(seconds<=180?'Almost time to return':'Break in progress'):complete?'Finished':'Ready when you are';
    document.getElementById('eyebrow').textContent=active?'TIME REMAINING':complete?'COMPLETED':'FLOATING TIMER';
    document.getElementById('progress').style.width=percentage+'%';
    document.getElementById('gauge-fill').style.strokeDasharray=(298.5*percentage/100)+' 300';
    document.body.dataset.warning=String(active&&seconds<=180);
  }
  update();
  window.setInterval(update,750);
</script>
</body>
</html>
